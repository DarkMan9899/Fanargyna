<body>
<noscript>Ակտիվացրեք JavaScript-ը՝ կայքը ճիշտ ցուցադրելու համար։</noscript>
<div id="root"></div>

<!-- 🔄 Language-based SEO switch -->
<script>
  const lang = window.location.pathname.split("/")[1] || "hy";
  const html = document.documentElement;
  html.lang = lang;

  const titles = {
    hy: "Ֆանարջյան Բուժկենտրոն — Անպտղության բուժում Երևանում",
    ru: "Армяно-Германский Медицинский Центр Фанарджян — лечение бесплодия в Ереване",
    en: "Fanarjyan Armenian-German Medical Center — IVF & infertility treatment in Yerevan"
  };

  const descriptions = {
    hy: document.querySelector('meta[name="description"]'),
    ru: document.querySelector('meta[name="description-ru"]'),
    en: document.querySelector('meta[name="description-en"]')
  };

  document.title = titles[lang] || titles.hy;
  if (descriptions[lang]) {
    document
            .querySelector('meta[name="description"]')
            .setAttribute("content", descriptions[lang].content);
  }
</script>
</body>
</html>
