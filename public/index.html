<!-- =========================
     LANGUAGE SEO SWITCH (SPA SAFE)

========================= -->
<script>
    (function () {
        const lang = location.pathname.split("/")[1] || "hy";
        document.documentElement.lang = ["hy","ru","en"].includes(lang) ? lang : "hy";

        const titles = {
            hy: "Ֆանարջյան Բուժկենտրոն — Անպտղության բուժում Երևանում",
            ru: "Армяно-Германский Медицинский Центр Фанарджян — лечение бесплодия в Ереване",
            en: "Fanarjyan Armenian-German Medical Center — IVF & infertility treatment in Yerevan"
        };

        const descriptions = {
            hy: "Ֆանարջյան Բուժկենտրոն — վերարտադրողական բժշկություն, անպտղության բուժում, IVF/ICSI, գինեկոլոգիա և ուրոլոգիա Երևանում։",
            ru: "Армяно-Германский медицинский центр Фанарджян — лечение бесплодия, ЭКО/ИКСИ, гинекология и урология в Ереване.",
            en: "Fanarjyan Armenian-German Medical Center — IVF/ICSI, infertility treatment, gynecology and urology in Yerevan, Armenia."
        };

        // Update title/description for SPA route
        document.title = titles[lang] || titles.hy;

        const descTag = document.querySelector('meta[name="description"]');
        if (descTag) descTag.setAttribute("content", descriptions[lang] || descriptions.hy);

        // Update OG tags (optional but good)
        const ogTitle = document.querySelector('meta[property="og:title"]');
        const ogDesc = document.querySelector('meta[property="og:description"]');
        if (ogTitle) ogTitle.setAttribute("content", document.title);
        if (ogDesc) ogDesc.setAttribute("content", descriptions[lang] || descriptions.hy);

        const twTitle = document.querySelector('meta[name="twitter:title"]');
        const twDesc = document.querySelector('meta[name="twitter:description"]');
        if (twTitle) twTitle.setAttribute("content", document.title);
        if (twDesc) twDesc.setAttribute("content", descriptions[lang] || descriptions.hy);

        // GTM SPA pageview event
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
            event: "virtual_pageview",
            page_path: location.pathname + location.search,
            page_title: document.title,
            page_language: lang
        });
    })();
</script>
